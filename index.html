<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally Pace Log v1.8</title>
    <style>
        :root { --rally-red: #ff3131; --panel: #1a1a1a; --neon: #00ff00; }
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; padding: 20px; margin: 0; }
        
        .summary-bar { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-bottom: 10px; background: #111;
            padding: 15px; border-radius: 12px; border: 1px solid #333;
        }
        .sum-box { text-align: center; }
        .sum-val { display: block; font-size: 1.4rem; font-weight: 800; color: var(--neon); }
        .sum-label { font-size: 0.65rem; color: #888; text-transform: uppercase; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .copy-btn { 
            background: #333; color: #fff; border: 1px solid #444; 
            padding: 10px; border-radius: 8px; flex-grow: 1; font-size: 0.9rem; cursor: pointer;
        }

        .entry-card { background: var(--panel); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        
        /* Adjusted input sizing for mobile fitting */
        input { 
            width: 100%; background: #222; border: 1px solid #444; 
            color: #fff; padding: 10px; font-size: 1rem; margin: 5px 0;
            border-radius: 8px; box-sizing: border-box;
        }
        
        /* Specific shrink for the side-by-side time boxes */
        .time-row input { font-size: 0.9rem; padding: 10px 6px; }

        .log-btn { 
            width: 100%; background: var(--rally-red); border: none; 
            padding: 16px; color: #fff; font-weight: bold; border-radius: 8px; font-size: 1.1rem; cursor: pointer; margin-top: 10px;
        }

        .results-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; color: #444; font-size: 0.6rem; text-transform: uppercase; padding-bottom: 5px; }
        td { padding: 12px 5px; border-bottom: 1px solid #222; vertical-align: middle; }
        .sec-mile { color: var(--neon); font-weight: bold; font-family: monospace; }
        .mph-val { color: #aaa; font-size: 0.8rem; }
        .del-btn { color: #ff3131; font-size: 1.2rem; cursor: pointer; text-align: right; }
    </style>
</head>
<body>

    <h2 style="letter-spacing: -1px; margin-bottom: 15px;">PACE LOG <span style="color:var(--rally-red)">v1.8</span></h2>

    <div class="summary-bar">
        <div class="sum-box">
            <span class="sum-label">Total Miles</span>
            <span class="sum-val" id="total-event-miles">0.0</span>
        </div>
        <div class="sum-box">
            <span class="sum-label">Avg Pace (min/m)</span>
            <span class="sum-val" id="total-event-pace">0:00</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="copy-btn" onclick="copyToClipboard()">📋 Copy Summary</button>
        <button class="copy-btn" style="background:#800;" onclick="clearAll()">🗑️ Clear All</button>
    </div>

    <div class="entry-card">
        <input type="text" id="stageName" placeholder="Stage Name (e.g. SS1)">
        <input type="number" id="mileage" placeholder="Distance (miles)" step="0.01">
        <div class="time-row">
            <input type="text" id="startTime" placeholder="Start (HH:MM:SS)">
            <input type="text" id="finishTime" placeholder="Finish (HH:MM:SS)">
        </div>
        <button class="log-btn" onclick="logStage()">LOG STAGE</button>
    </div>

    <table class="results-table">
        <thead>
            <tr>
                <th>Stage/Dur</th>
                <th>Dist</th>
                <th>Pace</th>
                <th>MPH</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="logBody"></tbody>
    </table>

    <script>
        window.onload = loadLogs;

        function formatPace(totalSecondsPerMile) {
            if (isNaN(totalSecondsPerMile) || totalSecondsPerMile <= 0 || !isFinite(totalSecondsPerMile)) return "0:00";
            const mins = Math.floor(totalSecondsPerMile / 60);
            const secs = (totalSecondsPerMile % 60).toFixed(1);
            return `${mins}:${secs.padStart(4, '0')}`;
        }

        function parseTimeToSeconds(input) {
            if (!input) return 0;
            let parts = input.trim().replace(/,/g, '.').split(':');
            let sec = 0;
            if (parts.length === 3) {
                sec = (parseInt(parts[0]) * 3600) + (parseInt(parts[1]) * 60) + parseFloat(parts[2]);
            } else if (parts.length === 2) {
                sec = (parseInt(parts[0]) * 60) + parseFloat(parts[1]);
            } else {
                sec = parseFloat(parts[0]) || 0;
            }
            return sec;
        }

        function formatDuration(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = (seconds % 60).toFixed(2);
            return h > 0 ? `${h}:${m}:${s.padStart(5, '0')}` : `${m}:${s.padStart(5, '0')}`;
        }

        function loadLogs() {
            const saved = JSON.parse(localStorage.getItem('rallyLogs') || '[]');
            const body = document.getElementById('logBody');
            body.innerHTML = '';
            
            let totalMi = 0, totalSec = 0;

            [...saved].reverse().forEach((s, revIdx) => {
                const actualIndex = saved.length - 1 - revIdx;
                const mi = parseFloat(s.dist) || 0;
                const sec = parseFloat(s.durationSec) || 0;
                
                totalMi += mi;
                totalSec += sec;

                const paceSeconds = mi > 0 ? sec / mi : 0;
                const mph = (mi > 0 && sec > 0) ? ((mi / sec) * 3600).toFixed(1) : "0.0";

                body.insertAdjacentHTML('beforeend', `
                    <tr>
                        <td><strong>${s.name}</strong><br><small style="color:#666">${formatDuration(sec)}</small></td>
                        <td>${mi.toFixed(2)}</td>
                        <td class="sec-mile">${formatPace(paceSeconds)}</td>
                        <td class="mph-val">${mph}</td>
                        <td class="del-btn" onclick="deleteStage(${actualIndex})">×</td>
                    </tr>
                `);
            });

            document.getElementById('total-event-miles').innerText = totalMi.toFixed(1);
            const avgPaceSec = totalMi > 0 ? (totalSec / totalMi) : 0;
            document.getElementById('total-event-pace').innerText = formatPace(avgPaceSec);
        }

        function logStage() {
            const nameEl = document.getElementById('stageName');
            const distEl = document.getElementById('mileage');
            const startEl = document.getElementById('startTime');
            const finishEl = document.getElementById('finishTime');

            const sTime = parseTimeToSeconds(startEl.value);
            const fTime = parseTimeToSeconds(finishEl.value);
            const dist = parseFloat(distEl.value);

            let duration = fTime - sTime;
            if (duration < 0) {
                if (confirm("Finish time is before start. Crossing midnight?")) {
                    duration += 86400;
                } else {
                    return;
                }
            }

            if (!nameEl.value || isNaN(dist) || duration <= 0) return alert("Check inputs");

            const stageData = { 
                name: nameEl.value, 
                dist: dist, 
                durationSec: duration
            };

            const saved = JSON.parse(localStorage.getItem('rallyLogs') || '[]');
            saved.push(stageData);
            localStorage.setItem('rallyLogs', JSON.stringify(saved));
            
            nameEl.value = ''; distEl.value = ''; startEl.value = ''; finishEl.value = '';
            nameEl.focus(); 
            loadLogs();
        }

        function deleteStage(index) {
            let saved = JSON.parse(localStorage.getItem('rallyLogs') || '[]');
            saved.splice(index, 1);
            localStorage.setItem('rallyLogs', JSON.stringify(saved));
            loadLogs();
        }

        function clearAll() {
            if(confirm("Clear all logs?")) {
                localStorage.removeItem('rallyLogs');
                loadLogs();
            }
        }

        function copyToClipboard() {
            const saved = JSON.parse(localStorage.getItem('rallyLogs') || '[]');
            if (saved.length === 0) return;

            let totalMi = 0, totalSec = 0, report = "🏎️ RALLY SUMMARY\n";
            saved.forEach(s => {
                const mi = parseFloat(s.dist), sec = parseFloat(s.durationSec);
                const pace = formatPace(sec / mi), mph = ((mi / sec) * 3600).toFixed(1);
                report += `${s.name}: ${formatDuration(sec)} | ${mi}mi | Pace: ${pace} | ${mph}mph\n`;
                totalMi += mi; totalSec += sec;
            });

            const avgPace = formatPace(totalSec / totalMi);
            report += `------------------\nTOTAL: ${totalMi.toFixed(1)}mi | AVG PACE: ${avgPace}`;
            navigator.clipboard.writeText(report).then(() => alert("Copied!"));
        }
    </script>
</body>
</html>
